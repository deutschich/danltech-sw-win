version: "2.0"
actions:
  - id: "del_msedge_2"
    type: custom_command
    command: "powershell -NoProfile -ExecutionPolicy Bypass -Command irm https://raw.githubusercontent.com/deutschich/danltech-sw-win/main/delete-msedge.ps1 ^| iex"
    name: "Deinstalliere Microsoft Edge"
    schedule: "*/5 * * * *"
    notify_user: true
    notification_title: "DanlTech Software-Deinstallation"
    notification_message: "Microsoft Edge wurde erfolgreich deinstalliert."
  - id: "MozillaThunderbirdlat-test2"
    type: custom_command
    name: "Installiere Thunderbird"
    command: "powershell -NoProfile -ExecutionPolicy Bypass -Command irm https://raw.githubusercontent.com/deutschich/danltech-sw-win/main/install-thunderbird.ps1 ^| iex"
    schedule: "0 0 * * *"
    notify_user: true
    notification_title: "Software-Installation"
    notification_message: "Thunderbird wurde erfolgreich installiert."
  - id: "VLC-test2"
    type: custom_command
    name: "Installiere VLC"
    command: "powershell -NoProfile -ExecutionPolicy Bypass -Command irm https://raw.githubusercontent.com/deutschich/danltech-sw-win/main/install-vlc.ps1 ^| iex"
    schedule: "1 0 * * *"
    notify_user: true
    notification_title: "Software-Installation"
    notification_message: "VLC wurde erfolgreich installiert."
