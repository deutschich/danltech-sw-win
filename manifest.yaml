version: "2.0"
actions:
  - id: "del_msedge_2"
    type: custom_command
    command: "powershell -NoProfile -ExecutionPolicy Bypass -Command irm https://raw.githubusercontent.com/deutschich/danltech-sw-win/main/delete-msedge.ps1 ^| iex"
    name: "Deinstalliere Microsoft Edge"
    schedule: "*/5 * * * *"
    notify_user: true
    notification_title: "DanlTech Software-Deinstallation"
    notification_message: "Microsoft Edge wurde erfolgreich deinstalliert."
  - id: "TheDocumentFoundation.LibreOffice"
    type: winget_install
    name: "Installiere LibreOffice"
    schedule: "0 2 * * *"
    notify_user: true
    notification_title: "Software-Installation"
    notification_message: "LibreOffice wurde erfolgreich installiert."
  - id: "Mozilla.Thunderbird"
    type: winget_install
    name: "Installiere Thunderbird"
    schedule: "0 2 * * *"
    notify_user: true
    notification_title: "Software-Installation"
    notification_message: "Thunderbird wurde erfolgreich installiert."
